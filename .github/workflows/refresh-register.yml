# Monthly venue refresh. Prepared by Josh Torney.
# Checks data.vic.gov.au every Monday morning for a new liquor licence register. When there is one, it
# merges it into locations.json (see tools/refresh_register.py), notes the changes in REGISTER_UPDATES.md
# and pushes, so the map and route planner pick it up. Run it by hand from the Actions tab with "Run workflow".
name: Monthly venue refresh

on:
  schedule:
    - cron: '0 20 * * 0'   # Sunday 20:00 UTC = Monday 7am in Geelong (6am in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas openpyxl
      - name: Merge the latest register
        run: python tools/refresh_register.py
      - name: Publish any changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then echo "No new register, nothing to publish"; exit 0; fi
          git config user.name "Josh Torney"
          git config user.email "jtorney92@users.noreply.github.com"
          git add locations.json tools/register_state.json REGISTER_UPDATES.md
          git commit -m "Venue refresh: $(python -c "import json;print(json.load(open('tools/register_state.json'))['last_file'])")"
          git push
