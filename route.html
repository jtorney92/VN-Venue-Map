<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Josh Torney">
<title>Route Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg:#14182b; --panel:#1b2140; --panel2:#232a4f; --line:#2c355f; --ink:#e8eaf3; --muted:#8d94b3; --accent:#e94560;
  --gold:#f5c542; --a:#3ecf8e; --b:#5c8df6; --c:#7d84a3; --contacted:#e8eaf3;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden; }
a { color:inherit; }
button { font-family:inherit; }

/* top bar */
#top { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
#top h1 { font-size:16px; font-weight:700; white-space:nowrap; }
#top h1 span { color:var(--accent); }
#top .grow { flex:1; }
.link-btn { font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); text-decoration:none; white-space:nowrap; cursor:pointer; }
.link-btn:hover { border-color:var(--accent); }

/* week strip */
#week { display:grid; grid-template-columns:repeat(6, minmax(150px, 1fr)); gap:10px; padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line); overflow-x:auto; }
.day { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; text-align:left; color:var(--ink); min-width:150px; }
.day:hover { border-color:var(--muted); }
.day.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.day .d { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.day .ar { font-size:13px; font-weight:600; margin:2px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.day .num { font-size:22px; font-weight:700; line-height:1; }
.day .num small { font-size:11px; color:var(--muted); font-weight:400; margin-left:4px; }
.bar { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--panel2); margin:8px 0 6px; }
.bar i { display:block; height:100%; }
.day .meta { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
.prog { height:3px; background:var(--panel2); border-radius:2px; margin-top:6px; overflow:hidden; }
.prog i { display:block; height:100%; background:var(--gold); }

/* main */
#main { flex:1; display:flex; min-height:0; }
#list { width:440px; min-width:440px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line); min-height:0; }
#map { flex:1; background:#1e1e1e; }
#filters { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
#dayhead h2 { font-size:17px; }
#dayhead p { font-size:12px; color:var(--muted); margin-top:2px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { font-size:11px; padding:4px 9px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
.chip .dot { width:8px; height:8px; border-radius:50%; }
.chip.off { opacity:.35; }
#q { width:100%; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:13px; outline:none; }
#q:focus { border-color:var(--accent); }
#groups { flex:1; overflow-y:auto; padding:8px 10px 90px; }
.grp { margin-bottom:8px; }
.gh { display:flex; align-items:center; gap:10px; padding:8px 6px; cursor:pointer; border-radius:6px; }
.gh:hover { background:var(--panel2); }
.gh .stop { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.gh .nm { font-size:14px; font-weight:600; flex:1; }
.gh .ct { font-size:11px; color:var(--muted); }
.gh .car { color:var(--muted); font-size:11px; transition:transform .15s; }
.grp.shut .car { transform:rotate(-90deg); }
.grp.shut .rows { display:none; }
.rows { margin-left:16px; border-left:2px solid var(--line); padding-left:10px; }
.v { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:start; padding:8px; border-radius:6px; background:var(--bg); margin-bottom:4px; }
.v:hover, .v.hl { outline:1px solid var(--accent); }
.v input[type=checkbox] { margin-top:3px; accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
.v .t { font-size:13px; font-weight:600; cursor:pointer; }
.v .s { font-size:11px; color:var(--muted); margin-top:1px; }
.v .acts { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
.v .acts button, .v .acts a { font-size:11px; padding:3px 7px; border-radius:4px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; text-decoration:none; }
.v .acts .on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.v .acts .on.gold { background:var(--gold); border-color:var(--gold); color:#111; }
.tag { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; }
.tag.Stockist { background:rgba(245,197,66,.18); color:var(--gold); }
.tag.A { background:rgba(62,207,142,.16); color:var(--a); }
.tag.B { background:rgba(92,141,246,.18); color:#8fb0ff; }
.tag.C { background:rgba(125,132,163,.2); color:#b4b9d1; }
.note { font-size:11px; color:var(--gold); margin-top:3px; }
.empty { color:var(--muted); font-size:13px; padding:20px 8px; line-height:1.6; }

/* plan bar */
#plan { position:fixed; left:16px; bottom:16px; z-index:1000; background:var(--panel2); border:1px solid var(--accent); border-radius:10px; padding:10px 12px; display:none; align-items:center; gap:10px; box-shadow:0 6px 24px rgba(0,0,0,.45); max-width:calc(100vw - 32px); }
#plan.show { display:flex; }
#plan .txt { font-size:13px; }
#plan .txt small { display:block; color:var(--muted); font-size:11px; }
#plan button, #plan a { font-size:12px; font-weight:700; padding:7px 11px; border-radius:6px; border:none; cursor:pointer; text-decoration:none; white-space:nowrap; }
#plan .go { background:var(--accent); color:#fff; }
#plan .clr { background:transparent; color:var(--muted); border:1px solid var(--line); }
#save-bar { display:none; padding:8px 14px; background:var(--panel2); border-top:1px solid var(--gold); font-size:12px; color:var(--gold); align-items:center; gap:8px; }
#save-bar.show { display:flex; }

/* map markers */
.mk { width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.9); color:#0b0e1a; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.5); }
.mk.contacted { border-color:#fff; box-shadow:0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.5); }
.mk.picked { transform:scale(1.25); border-color:var(--accent); box-shadow:0 0 0 3px rgba(233,69,96,.5); }
#map.far .sub-lbl.s { display:none; }
.sub-lbl { background:rgba(20,24,43,.85); color:#fff; border:1px solid var(--line); border-radius:12px; padding:2px 8px; font-size:11px; font-weight:700; white-space:nowrap; }
.leaflet-popup-content { font-size:12px; line-height:1.5; }
#loader { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; color:var(--muted); font-size:13px; }

@media (max-width:820px) {
  #top h1 { font-size:14px; }
  #week { grid-template-columns:repeat(6, 150px); padding:10px 12px; }
  #main { flex-direction:column; overflow-y:auto; }
  #map { flex:none; height:38vh; order:-1; }
  #list { width:100%; min-width:0; border-right:none; min-height:auto; }
  #groups { overflow:visible; }
  #plan { left:10px; right:10px; bottom:10px; }
  #plan .txt { flex:1; }
}

/* run mode */
#run { position:fixed; inset:0; z-index:5000; background:var(--bg); display:none; flex-direction:column; }
#run.show { display:flex; }
#run .rtop { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
#run .rtop b { flex:1; font-size:14px; }
#run .rbody { flex:1; overflow-y:auto; padding:16px; max-width:640px; width:100%; margin:0 auto; }
.dots { display:flex; gap:4px; margin-bottom:14px; }
.dots i { flex:1; height:4px; border-radius:2px; background:var(--panel2); }
.dots i.done { background:var(--a); } .dots i.now { background:var(--accent); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
.card h2 { font-size:22px; line-height:1.2; }
.card .addr { color:var(--muted); font-size:13px; margin-top:4px; }
.card h4 { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; font-weight:700; }
.card .hint { font-size:14px; line-height:1.5; }
.card .hint b { color:var(--gold); font-weight:600; }
.hist { font-size:13px; line-height:1.5; border-left:2px solid var(--line); padding-left:10px; margin-top:6px; }
.hist small { color:var(--muted); display:block; }
.bigbtn { display:block; width:100%; text-align:center; padding:15px; border-radius:10px; font-size:16px; font-weight:700; border:none; cursor:pointer; text-decoration:none; margin-bottom:10px; }
.waze { background:#33ccff; color:#0b1a2a; }
.next { background:var(--accent); color:#fff; }
.ghost { background:var(--panel2); color:var(--ink); border:1px solid var(--line); }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opt { padding:12px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; }
.opt.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.fld { width:100%; margin-top:8px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:15px; font-family:inherit; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.sumrow { padding:10px 0; border-top:1px solid var(--line); font-size:13px; line-height:1.5; }
.sumrow b { font-size:14px; }
#fups { margin:2px 2px 12px; padding:10px 12px; border:1px solid var(--gold); border-radius:8px; background:rgba(245,197,66,.06); }
#fups h3 { font-size:12px; color:var(--gold); margin-bottom:4px; }
#fups div { font-size:12px; padding:3px 0; cursor:pointer; }
#fups div small { color:var(--muted); }
.last { font-size:11px; color:#9fe0c0; margin-top:3px; }
</style>
</head>
<body>
<div id="loader">Loading venues...</div>
<div id="top">
  <h1><span>&#9679;</span> Route Planner</h1>
  <div class="grow"></div>
  <a class="link-btn" href="index.html">Open venue map</a>
</div>
<div id="week"></div>
<div id="main">
  <div id="list">
    <div id="filters">
      <div id="dayhead"></div>
      <div class="chips" id="pri"></div>
      <div class="chips" id="types"></div>
      <input id="q" type="text" placeholder="Filter by venue or suburb" autocomplete="off">
    </div>
    <div id="groups"></div>
    <div id="save-bar"><span style="flex:1">Status changes saved on this device. Upload them from the venue map.</span></div>
  </div>
  <div id="map"></div>
</div>
<div id="plan">
  <div class="txt"><b id="plan-n">0 stops</b><small id="plan-sub"></small></div>
  <button class="go" onclick="startRun()">Start run</button>
  <button class="clr" onclick="openCal()">Calendar</button>
  <a class="clr" id="plan-go" target="_blank" rel="noopener">Google Maps</a>
  <button class="clr" onclick="clearPlan()">Clear</button>
</div>


<div id="run">
  <div class="rtop"><b id="run-title">Today's run</b><button class="link-btn" onclick="showSummary()">Day summary</button><button class="link-btn" onclick="closeRun()">Close</button></div>
  <div class="rbody" id="run-body"></div>
</div>
<script>
// ---------- Setup ----------
const BASE_PT = [-38.1604, 144.3374];   // Via Nova, Bridge St Newtown: every run starts and ends here
const DAYS = [
  { key:'Mon - Geelong CBD & West',        d:'Mon', ar:'Geelong CBD and West' },
  { key:'Tue - Surf Coast',                d:'Tue', ar:'Surf Coast' },
  { key:'Wed - Bellarine',                 d:'Wed', ar:'Bellarine' },
  { key:'Thu - Highton, Belmont & South',  d:'Thu', ar:'Highton, Belmont, South' },
  { key:'Fri - North & Golden Plains',     d:'Fri', ar:'North and Golden Plains' },
  { key:'Monthly - Ballarat & Daylesford', d:'Monthly', ar:'Ballarat and Daylesford' },
];
const PRI = { Stockist:'#f5c542', A:'#3ecf8e', B:'#5c8df6', C:'#7d84a3' };
const MAX_STOPS = 15;   // a full day; Google Maps takes the first 10 in one link, Waze goes stop by stop
const GMAPS_MAX = 10;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
};
const idOf = l => (l.n + '|' + (+l.lat).toFixed(5) + '|' + (+l.lng).toFixed(5)).toLowerCase();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function km(a, b) {
  const R = 6371, dLat = (b[0]-a[0])*Math.PI/180, dLng = (b[1]-a[1])*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

let ALL = [], EDITS = store.get('vm_edits', {}), ADDED = store.get('vm_added', []);
let day = store.get('vr_day', DAYS[0].key);
let showPri = new Set(store.get('vr_pri', ['Stockist','A','B']));
let hideTypes = new Set(store.get('vr_hide_types', []));
let PLAN = store.get('vr_plan', []);      // venue ids picked for today
let shut = new Set();

function pri(l) { return l.st === 'stockist' ? 'Stockist' : (l.tier || 'C'); }
function build(base) {
  ALL = [...base, ...ADDED].map(l => {
    const id = idOf(l), e = EDITS[id] || {};
    return { ...l, id, st: e.st || l.st || 'available', note: e.note != null ? e.note : (l.note || ''), cat: e.cat || l.cat || 'Other', tier: e.tier || l.tier || '' };
  }).filter(l => DAYS.some(d => d.key === l.zone));
}

// ---------- Week strip ----------
function renderWeek() {
  document.getElementById('week').innerHTML = DAYS.map(d => {
    const v = ALL.filter(l => l.zone === d.key && pri(l) !== 'C');
    const n = k => v.filter(l => pri(l) === k).length;
    const s = n('Stockist'), a = n('A'), b = n('B'), t = v.length || 1;
    const touched = v.filter(l => l.st !== 'available').length;
    return `<button class="day ${d.key === day ? 'on' : ''}" onclick="pickDay('${esc(d.key)}')">
      <div class="d">${d.d}</div><div class="ar">${d.ar}</div>
      <div class="num">${v.length}<small>targets</small></div>
      <div class="bar"><i style="width:${s/t*100}%;background:${PRI.Stockist}"></i><i style="width:${a/t*100}%;background:${PRI.A}"></i><i style="width:${b/t*100}%;background:${PRI.B}"></i></div>
      <div class="meta"><span>${s} stockist${s === 1 ? '' : 's'} · ${a} A · ${b} B</span></div>
      <div class="meta" style="margin-top:4px"><span>${touched} of ${v.length} worked</span><span>${Math.round(touched/t*100)}%</span></div>
      <div class="prog"><i style="width:${touched/t*100}%"></i></div>
    </button>`;
  }).join('');
}
function pickDay(k) { day = k; store.set('vr_day', k); shut.clear(); renderAll(true); }

// ---------- Filters ----------
function renderFilters(v) {
  const d = DAYS.find(x => x.key === day);
  document.getElementById('dayhead').innerHTML = `<h2>${d.d === 'Monthly' ? 'Monthly run' : d.d}: ${d.ar}</h2><p>Suburbs in driving order from the distillery. Tick venues to build today's route.</p>`;
  document.getElementById('pri').innerHTML = ['Stockist','A','B','C'].map(k => {
    const c = v.filter(l => pri(l) === k).length;
    return `<button class="chip ${showPri.has(k) ? '' : 'off'}" onclick="togglePri('${k}')"><span class="dot" style="background:${PRI[k]}"></span>${k === 'Stockist' ? 'Stockists' : 'Priority ' + k} <span style="color:var(--muted)">${c}</span></button>`;
  }).join('');
  const types = [...new Set(v.filter(l => showPri.has(pri(l))).map(l => l.cat))].sort();
  document.getElementById('types').innerHTML = types.map(t =>
    `<button class="chip ${hideTypes.has(t) ? 'off' : ''}" onclick="toggleType('${esc(t)}')">${esc(t)}</button>`).join('');
}
function togglePri(k) { showPri.has(k) ? showPri.delete(k) : showPri.add(k); store.set('vr_pri', [...showPri]); renderAll(true); }
function toggleType(t) { hideTypes.has(t) ? hideTypes.delete(t) : hideTypes.add(t); store.set('vr_hide_types', [...hideTypes]); renderAll(true); }

// ---------- Driving order ----------
// Suburbs run as a loop: sorted by bearing around the middle of the day's area, starting from the suburb
// closest to the distillery and heading the way that keeps the next hop shorter. Venues inside a suburb
// follow nearest next venue.
function ordered(list) {
  const subs = {};
  list.forEach(l => (subs[l.sub || 'Other'] = subs[l.sub || 'Other'] || []).push(l));
  let cen = Object.entries(subs).map(([name, ls]) => ({ name, ls, c: [ls.reduce((s, l) => s + +l.lat, 0)/ls.length, ls.reduce((s, l) => s + +l.lng, 0)/ls.length] }));
  if (cen.length > 2) {
    const mid = [cen.reduce((s, g) => s + g.c[0], 0)/cen.length, cen.reduce((s, g) => s + g.c[1], 0)/cen.length];
    cen.forEach(g => g.ang = Math.atan2(g.c[0] - mid[0], (g.c[1] - mid[1]) * Math.cos(mid[0]*Math.PI/180)));
    cen.sort((x, y) => x.ang - y.ang);
    const start = cen.reduce((bi, g, i) => km(BASE_PT, g.c) < km(BASE_PT, cen[bi].c) ? i : bi, 0);
    cen = [...cen.slice(start), ...cen.slice(0, start)];
    if (km(cen[0].c, cen[cen.length - 1].c) < km(cen[0].c, cen[1].c)) cen = [cen[0], ...cen.slice(1).reverse()];
  } else cen.sort((x, y) => km(BASE_PT, x.c) - km(BASE_PT, y.c));
  let at = BASE_PT;
  return cen.map(g => {
    const left = [...g.ls], seq = []; let p = at;
    while (left.length) { left.sort((x, y) => km(p, [x.lat, x.lng]) - km(p, [y.lat, y.lng])); const n = left.shift(); seq.push(n); p = [n.lat, n.lng]; }
    at = p; return { name: g.name, c: g.c, ls: seq };
  });
}

// ---------- List ----------
let groups = [];
function current() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  return ALL.filter(l => l.zone === day && showPri.has(pri(l)) && !hideTypes.has(l.cat) &&
    (!q || (l.n + ' ' + (l.sub || '') + ' ' + (l.a || '')).toLowerCase().includes(q)));
}
function renderList() {
  groups = ordered(current());
  const el = document.getElementById('groups');
  if (!groups.length) { el.innerHTML = fupsHtml() + '<div class="empty">No venues match these filters. Switch on another priority or venue type above.</div>'; return; }
  el.innerHTML = fupsHtml() + groups.map((g, gi) => `
    <div class="grp ${shut.has(g.name) ? 'shut' : ''}" id="g${gi}">
      <div class="gh" onclick="toggleGroup('${esc(g.name).replace(/'/g, "\\'")}', ${gi})">
        <div class="stop">${gi + 1}</div><div class="nm">${esc(g.name)}</div>
        <div class="ct">${g.ls.length} venue${g.ls.length === 1 ? '' : 's'}${dist(gi)}</div><div class="car">&#9660;</div>
      </div>
      <div class="rows">${g.ls.map(rowHtml).join('')}</div>
    </div>`).join('');
}
function dist(gi) {
  const prev = gi === 0 ? BASE_PT : groups[gi - 1].c;
  return ' · ' + Math.round(km(prev, groups[gi].c)) + ' km';
}
function rowHtml(l) {
  const p = pri(l), picked = PLAN.includes(l.id);
  const nav = `https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}`;
  return `<div class="v" id="v-${cssId(l.id)}" onmouseenter="hl('${jsId(l.id)}')">
    <input type="checkbox" ${picked ? 'checked' : ''} onchange="togglePlan('${jsId(l.id)}')" aria-label="Add ${esc(l.n)} to today's route">
    <div>
      <div class="t" onclick="fly('${jsId(l.id)}')">${esc(l.n)}</div>
      <div class="s">${esc(l.cat)}${l.cap ? ' · ' + l.cap + ' patrons' : ''} · ${esc(l.a || '')}</div>
      ${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}${lastVisit(l)}
      <div class="acts">
        <button class="${l.st === 'contacted' ? 'on' : ''}" onclick="setSt('${jsId(l.id)}','contacted')">Contacted</button>

function togglePlan(id) {

  while (left.length) { left.sort((x, y) => km(p, [x.lat, x.lng]) - km(p, [y.lat, y.lng])); const n = left.shift(); seq.push(n); p = [n.lat, n.lng]; }

}

function gcalLink(x) {
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(evTitle(x)) +
    '&dates=' + dstamp(x.start) + '/' + dstamp(x.end) + '&location=' + encodeURIComponent(evLoc(x)) + '&details=' + encodeURIComponent(evText(x));
}
function icsEsc(t) { return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function fold(line) { const out = []; while (line.length > 74) { out.push(line.slice(0, 74)); line = ' ' + line.slice(74); } out.push(line); return out.join('\r\n'); }
function downloadIcs() {
  const st = calStops(), now = dstamp(new Date().getHours() * 60 + new Date().getMinutes(), 0), dkey = dstamp(0).slice(0, 8);
  const ev = st.map(x => ['BEGIN:VEVENT', 'UID:vn-' + dkey + '-' + (x.l.vid || x.i) + '@via-nova-route', 'DTSTAMP:' + now,
    'DTSTART;TZID=Australia/Melbourne:' + dstamp(x.start), 'DTEND;TZID=Australia/Melbourne:' + dstamp(x.end),
    'SUMMARY:' + icsEsc(evTitle(x)), 'LOCATION:' + icsEsc(evLoc(x)), 'GEO:' + x.l.lat + ';' + x.l.lng,
    'DESCRIPTION:' + icsEsc(evText(x)), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(evTitle(x)), 'TRIGGER:-PT10M', 'END:VALARM', 'END:VEVENT'].map(fold).join('\r\n'));
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Josh Torney//Via Nova Route Planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE', 'TZID:Australia/Melbourne',
    'BEGIN:STANDARD', 'DTSTART:19700405T030000', 'RRULE:FREQ=YEARLY;BYMONTH=4;BYDAY=1SU', 'TZOFFSETFROM:+1100', 'TZOFFSETTO:+1000', 'END:STANDARD',
    'BEGIN:DAYLIGHT', 'DTSTART:19701004T020000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=1SU', 'TZOFFSETFROM:+1000', 'TZOFFSETTO:+1100', 'END:DAYLIGHT',
    'END:VTIMEZONE', ...ev, 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = 'via-nova-run-' + dkey + '.ics'; a.click();
}

// Follow-ups due in the next week, from the run log (cleared once the venue is logged again)
function dueFollowUps() {
  const lim = plusDays(7), out = [];
  LOG.forEach(e => {
    if (!e.fu || e.fu > lim) return;
    if (LOG.some(x => x.vid === e.vid && x.date > e.date)) return;
    out.push(e);
  });
  return out.sort((a, b) => a.fu < b.fu ? -1 : 1);
}
function fupsHtml() {
  const f = dueFollowUps(); if (!f.length) return '';
  return `<div id="fups"><h3>Follow-ups due this week (${f.length})</h3>${f.map(e => {
    const l = byVid(e.vid), d = l ? DAYS.find(x => x.key === l.zone) : null;
    return `<div onclick="${l ? `pickDay('${esc(l.zone)}');setTimeout(()=>{fly('${jsId(l.id)}');hl('${jsId(l.id)}',true)},300)` : ''}">${esc(e.n)} <small>· ${dmy(e.fu)}${e.fu < today() ? ' overdue' : ''}${d ? ' · ' + d.d : ''}${e.next ? ' · ' + esc(e.next) : ''}</small></div>`;
  }).join('')}</div>`;
}
function lastVisit(l) {
  const e = [...LOG].reverse().find(x => x.vid === vidOf(l));
  return e ? `<div class="last">Last: ${dmy(e.date)} · ${esc(e.act)}${e.fu ? ' · follow up ' + dmy(e.fu) : ''}</div>` : '';
}

// ---------- Go ----------
function renderAll(fit) {
  const v = ALL.filter(l => l.zone === day);
  renderWeek(); renderFilters(v); renderList(); drawMap(fit); renderPlan(); saveBar();
}
document.getElementById('q').addEventListener('input', () => { renderList(); drawMap(false); });
(async () => {
  try {
    const r = await fetch('locations.json', { cache:'no-cache' });
    build(await r.json());
  } catch (e) {
    document.getElementById('loader').textContent = 'Could not load locations.json. Open this page from the same site as the venue map.'; return;
  }
  if (!DAYS.some(d => d.key === day)) day = DAYS[0].key;
  renderAll(true);
  document.getElementById('loader').remove();
  if (RUN && RUN.date === today() && RUN.idx < RUN.ids.length) openRun();
})();
</script>
