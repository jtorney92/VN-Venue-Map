<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Josh Torney">
<title>Route Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2140">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="hours.js"></script>
<style>
:root {
  --bg:#14182b; --panel:#1b2140; --panel2:#232a4f; --line:#2c355f; --ink:#e8eaf3; --muted:#8d94b3; --accent:#e94560;
  --gold:#f5c542; --a:#3ecf8e; --b:#5c8df6; --c:#7d84a3; --contacted:#e8eaf3;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { height:100vh; height:100dvh; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden; }
a { color:inherit; }
button { font-family:inherit; }

/* top bar */
#top { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
#top h1 { font-size:16px; font-weight:700; white-space:nowrap; }
#top h1 span { color:var(--accent); }
#top .grow { flex:1; }
.link-btn { font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); text-decoration:none; white-space:nowrap; cursor:pointer; }
.link-btn:hover { border-color:var(--accent); }

/* week strip */
#week { display:grid; grid-template-columns:repeat(6, minmax(150px, 1fr)); gap:10px; padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line); overflow-x:auto; }
.day { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; text-align:left; color:var(--ink); min-width:150px; }
.day:hover { border-color:var(--muted); }
.day.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.day .d { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.day .ar { font-size:13px; font-weight:600; margin:2px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.day .num { font-size:22px; font-weight:700; line-height:1; }
.day .num small { font-size:11px; color:var(--muted); font-weight:400; margin-left:4px; }
.bar { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--panel2); margin:8px 0 6px; }
.bar i { display:block; height:100%; }
.day .meta { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
.prog { height:3px; background:var(--panel2); border-radius:2px; margin-top:6px; overflow:hidden; }
.prog i { display:block; height:100%; background:var(--gold); }

/* main */
#main { flex:1; display:flex; min-height:0; }
#list { width:440px; min-width:440px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line); min-height:0; }
#map { flex:1; background:#1e1e1e; }
#filters { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
#dayhead h2 { font-size:17px; }
#dayhead p { font-size:12px; color:var(--muted); margin-top:2px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { font-size:11px; padding:4px 9px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
.chip .dot { width:8px; height:8px; border-radius:50%; }
.chip.off { opacity:.35; }
#q { width:100%; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:13px; outline:none; }
#q:focus { border-color:var(--accent); }
#groups { flex:1; overflow-y:auto; padding:8px 10px 90px; }
.grp { margin-bottom:8px; }
.gh { display:flex; align-items:center; gap:10px; padding:8px 6px; cursor:pointer; border-radius:6px; }
.gh:hover { background:var(--panel2); }
.gh .stop { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.gh .nm { font-size:14px; font-weight:600; flex:1; }
.gh .ct { font-size:11px; color:var(--muted); }
.gh .car { color:var(--muted); font-size:11px; transition:transform .15s; }
.grp.shut .car { transform:rotate(-90deg); }
.grp.shut .rows { display:none; }
.rows { margin-left:16px; border-left:2px solid var(--line); padding-left:10px; }
.v { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:start; padding:8px; border-radius:6px; background:var(--bg); margin-bottom:4px; }
.v:hover, .v.hl { outline:1px solid var(--accent); }
.v input[type=checkbox] { margin-top:3px; accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
.v .t { font-size:13px; font-weight:600; cursor:pointer; }
.v .s { font-size:11px; color:var(--muted); margin-top:1px; }
.v .acts { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
.v .acts button, .v .acts a { font-size:11px; padding:3px 7px; border-radius:4px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; text-decoration:none; }
.v .acts .on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.v .acts .on.gold { background:var(--gold); border-color:var(--gold); color:#111; }
.tag { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; }
.tag.Stockist { background:rgba(245,197,66,.18); color:var(--gold); }
.tag.A { background:rgba(62,207,142,.16); color:var(--a); }
.tag.B { background:rgba(92,141,246,.18); color:#8fb0ff; }
.tag.C { background:rgba(125,132,163,.2); color:#b4b9d1; }
.note { font-size:11px; color:var(--gold); margin-top:3px; }
.empty { color:var(--muted); font-size:13px; padding:20px 8px; line-height:1.6; }

/* plan bar */
#plan { position:fixed; left:16px; bottom:16px; z-index:1000; background:var(--panel2); border:1px solid var(--accent); border-radius:10px; padding:10px 12px; display:none; align-items:center; gap:10px; box-shadow:0 6px 24px rgba(0,0,0,.45); max-width:calc(100vw - 32px); }
#plan.show { display:flex; }
#plan .txt { font-size:13px; }
#plan .txt small { display:block; color:var(--muted); font-size:11px; }
#plan button, #plan a { font-size:12px; font-weight:700; padding:7px 11px; border-radius:6px; border:none; cursor:pointer; text-decoration:none; white-space:nowrap; }
#plan .go { background:var(--accent); color:#fff; }
#plan .clr { background:transparent; color:var(--muted); border:1px solid var(--line); }
#save-bar { display:none; padding:8px 14px; background:var(--panel2); border-top:1px solid var(--gold); font-size:12px; color:var(--gold); align-items:center; gap:8px; }
#save-bar.show { display:flex; }

/* map markers */
.mk { width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.9); color:#0b0e1a; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.5); }
.mk.contacted { border-color:#fff; box-shadow:0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.5); }
.mk.picked { transform:scale(1.25); border-color:var(--accent); box-shadow:0 0 0 3px rgba(233,69,96,.5); }
#map.far .sub-lbl.s { display:none; }
.sub-lbl { background:rgba(20,24,43,.85); color:#fff; border:1px solid var(--line); border-radius:12px; padding:2px 8px; font-size:11px; font-weight:700; white-space:nowrap; }
.leaflet-popup-content { font-size:12px; line-height:1.5; }
#loader { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; color:var(--muted); font-size:13px; }

@media (max-width:820px) {
  #top h1 { font-size:14px; }
  #week { grid-template-columns:repeat(6, 150px); padding:10px 12px; }
  #main { flex-direction:column; overflow-y:auto; }
  #map { flex:none; height:38vh; height:38dvh; order:-1; }
  #list { width:100%; min-width:0; border-right:none; min-height:auto; }
  #groups { overflow:visible; padding-bottom:calc(110px + env(safe-area-inset-bottom)); }
  #plan { left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); }
  #plan { flex-wrap:wrap; gap:6px 8px; padding:10px; }
  #plan .txt { flex:1 1 100%; }
  #plan .txt small { display:inline; margin-left:6px; }
  #plan button, #plan a { flex:1 1 auto; text-align:center; padding:9px 8px; }
  #toast { bottom:calc(150px + env(safe-area-inset-bottom)); }
}

/* quick picking */
.sugg { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }
.sugg select { padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:13px; }
.sugg .go { padding:7px 12px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:13px; cursor:pointer; }
.sugg .ghost2 { padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:12px; cursor:pointer; }
.addall { font-size:11px; padding:3px 8px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; white-space:nowrap; }
.addall:hover { border-color:var(--accent); }
.why { font-size:11px; color:var(--gold); margin-top:3px; }
#toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom)); z-index:6000; background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; max-width:90vw; display:none; box-shadow:0 6px 24px rgba(0,0,0,.4); }
#toast.show { display:block; }

/* run mode */
#run { position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh; z-index:5000; background:var(--bg); display:none; flex-direction:column; }
#run.show { display:flex; }
#run .rtop { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
#run .rtop b { flex:1; font-size:14px; }
#run .rbody { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:16px 16px calc(40px + env(safe-area-inset-bottom)); max-width:640px; width:100%; margin:0 auto; }
.dots { display:flex; gap:4px; margin-bottom:14px; }
.dots i { flex:1; height:4px; border-radius:2px; background:var(--panel2); }
.dots i.done { background:var(--a); } .dots i.now { background:var(--accent); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
.card h2 { font-size:22px; line-height:1.2; }
.card .addr { color:var(--muted); font-size:13px; margin-top:4px; }
.card h4 { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; font-weight:700; }
.card .hint { font-size:14px; line-height:1.5; }
.card .hint b { color:var(--gold); font-weight:600; }
.hist { font-size:13px; line-height:1.5; border-left:2px solid var(--line); padding-left:10px; margin-top:6px; }
.hist small { color:var(--muted); display:block; }
.bigbtn { display:block; width:100%; text-align:center; padding:15px; border-radius:10px; font-size:16px; font-weight:700; border:none; cursor:pointer; text-decoration:none; margin-bottom:10px; }
.waze { background:#33ccff; color:#0b1a2a; }
.next { background:var(--accent); color:#fff; }
.ghost { background:var(--panel2); color:var(--ink); border:1px solid var(--line); }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opt { padding:12px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; }
.opt.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.fld { width:100%; margin-top:8px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:15px; font-family:inherit; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.sumrow { padding:10px 0; border-top:1px solid var(--line); font-size:13px; line-height:1.5; }
.sumrow b { font-size:14px; }
#fups { margin:2px 2px 12px; padding:10px 12px; border:1px solid var(--gold); border-radius:8px; background:rgba(245,197,66,.06); }
#fups h3 { font-size:12px; color:var(--gold); margin-bottom:4px; }
#fups div { font-size:12px; padding:3px 0; cursor:pointer; }
#fups div small { color:var(--muted); }
.last { font-size:11px; color:#9fe0c0; margin-top:3px; }
.hrs { font-size:11px; color:var(--muted); margin-top:3px; }
.hrs.shut, .hrs .shut { color:var(--accent); font-weight:600; }
.hrs.early { color:var(--gold); }
.hbox { font-size:14px; line-height:1.5; }
.hbox .now { font-weight:700; } .hbox .now.open { color:var(--a); } .hbox .now.closed { color:var(--accent); }
.hbox small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
.hbtns { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.hbtns a, .hbtns button { font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; text-decoration:none; }
.hed { margin-top:10px; }
.hed .hr { display:grid; grid-template-columns:42px 1fr 1fr auto; gap:6px; align-items:center; margin-top:6px; font-size:13px; }
.hed input[type=time] { width:100%; padding:7px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px; font-family:inherit; }
.hed label.cl { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; white-space:nowrap; }
.hed .quick { display:grid; grid-template-columns:1fr 1fr auto; gap:6px; align-items:center; }
.hed .quick button, .hed .save button { font-size:13px; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; }
.hed .save { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.hed .save .pri { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
</style>
</head>
<body>
<div id="loader">Loading venues...</div>
<div id="top">
  <h1><span>&#9679;</span> Route Planner</h1>
  <div class="grow"></div>
  <button class="link-btn" onclick="openMore()">More</button>
  <a class="link-btn" href="index.html">Open venue map</a>
</div>
<div id="week"></div>
<div id="main">
  <div id="list">
    <div id="filters">
      <div id="dayhead"></div>
      <div class="chips" id="pri"></div>
      <div class="chips" id="types"></div>
      <input id="q" type="text" placeholder="Filter by venue or suburb" autocomplete="off">
    </div>
    <div id="groups"></div>
    <div id="save-bar"><span style="flex:1">Status changes saved on this device. Upload them from the venue map.</span></div>
  </div>
  <div id="map"></div>
</div>
<div id="toast"></div>
<div id="plan">
  <div class="txt"><b id="plan-n">0 stops</b><small id="plan-sub"></small></div>
  <button class="go" id="plan-start" onclick="startRun()">Start run</button>
  <button class="clr" onclick="openCal()">Calendar</button>
  <button class="clr" onclick="openKit()">Kit</button>
  <a class="clr" id="plan-go" target="_blank" rel="noopener">Google Maps</a>
  <button class="clr" onclick="clearPlan()">Clear</button>
</div>


<div id="run">
  <div class="rtop"><b id="run-title">Today's run</b><button class="link-btn" onclick="showSummary()">Day summary</button><button class="link-btn" onclick="closeRun()">Close</button></div>
  <div class="rbody" id="run-body"></div>
</div>
<script>
// ---------- Setup ----------
const BASE_PT = [-38.1604, 144.3374];   // Via Nova, Bridge St Newtown: every run starts and ends here
const DAYS = [
  { key:'Mon - Geelong CBD & West',        d:'Mon', ar:'Geelong CBD and West' },
  { key:'Tue - Surf Coast',                d:'Tue', ar:'Surf Coast' },
  { key:'Wed - Bellarine',                 d:'Wed', ar:'Bellarine' },
  { key:'Thu - Highton, Belmont & South',  d:'Thu', ar:'Highton, Belmont, South' },
  { key:'Fri - North & Golden Plains',     d:'Fri', ar:'North and Golden Plains' },
  { key:'Monthly - Ballarat & Daylesford', d:'Monthly', ar:'Ballarat and Daylesford' },
];
const PRI = { Stockist:'#f5c542', A:'#3ecf8e', B:'#5c8df6', C:'#7d84a3' };
const MAX_STOPS = 15;   // a full day; Google Maps takes the first 10 in one link, Waze goes stop by stop
const GMAPS_MAX = 10;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
};
const legacyId = l => (l.n + '|' + (+l.lat).toFixed(5) + '|' + (+l.lng).toFixed(5)).toLowerCase();
const idOf = l => l.vid ? String(l.vid) : legacyId(l);   // venue ID (licence number) stays put when names or coordinates are tidied
// Housekeeping: move edits saved under the old name-based keys onto venue IDs, and drop edits for venues no longer in the list
function tidyEdits(list) {
  const ids = new Set(list.map(idOf)), byLegacy = {};
  list.forEach(l => { byLegacy[legacyId(l)] = idOf(l); });
  let changed = false;
  Object.keys(EDITS).forEach(k => {
    if (ids.has(k)) return;
    const to = byLegacy[k];
    if (to && !EDITS[to]) EDITS[to] = EDITS[k];
    delete EDITS[k]; changed = true;
  });
  return changed;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function km(a, b) {
  const R = 6371, dLat = (b[0]-a[0])*Math.PI/180, dLng = (b[1]-a[1])*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

let ALL = [], EDITS = store.get('vm_edits', {}), ADDED = store.get('vm_added', []);
let day = store.get('vr_day', DAYS[0].key);
let showPri = new Set(store.get('vr_pri', ['Stockist','A','B']));
let hideTypes = new Set(store.get('vr_hide_types', []));
let PLAN = store.get('vr_plan', []);      // venue ids picked for today
let shut = new Set();

function pri(l) { return l.st === 'stockist' ? 'Stockist' : (l.tier || 'C'); }
function build(base) {
  if (tidyEdits([...base, ...ADDED])) store.set('vm_edits', EDITS);
  ALL = [...base, ...ADDED].map(l => {
    const id = idOf(l), e = EDITS[id] || {};
    return { ...l, id, st: e.st || l.st || 'available', note: e.note != null ? e.note : (l.note || ''), cat: e.cat || l.cat || 'Other', tier: e.tier || l.tier || '' };
  }).filter(l => DAYS.some(d => d.key === l.zone));
}

// ---------- Week strip ----------
function renderWeek() {
  document.getElementById('week').innerHTML = DAYS.map(d => {
    const v = ALL.filter(l => l.zone === d.key && pri(l) !== 'C');
    const n = k => v.filter(l => pri(l) === k).length;
    const s = n('Stockist'), a = n('A'), b = n('B'), t = v.length || 1;
    const touched = v.filter(l => l.st !== 'available').length;
    return `<button class="day ${d.key === day ? 'on' : ''}" onclick="pickDay('${esc(d.key)}')">
      <div class="d">${d.d}</div><div class="ar">${d.ar}</div>
      <div class="num">${v.length}<small>targets</small></div>
      <div class="bar"><i style="width:${s/t*100}%;background:${PRI.Stockist}"></i><i style="width:${a/t*100}%;background:${PRI.A}"></i><i style="width:${b/t*100}%;background:${PRI.B}"></i></div>
      <div class="meta"><span>${s} stockist${s === 1 ? '' : 's'} · ${a} A · ${b} B</span></div>
      <div class="meta" style="margin-top:4px"><span>${touched} of ${v.length} worked</span><span>${Math.round(touched/t*100)}%</span></div>
      <div class="prog"><i style="width:${touched/t*100}%"></i></div>
    </button>`;
  }).join('');
}
function pickDay(k) { day = k; store.set('vr_day', k); shut.clear(); renderAll(true); }

// ---------- Filters ----------
function renderFilters(v) {
  const d = DAYS.find(x => x.key === day);
  document.getElementById('dayhead').innerHTML = `<h2>${d.d === 'Monthly' ? 'Monthly run' : d.d}: ${d.ar}</h2><p>Suburbs in driving order from the distillery. Let it suggest a run, add a whole suburb, tap pins on the map, or tick venues one by one.</p>
    <div class="sugg"><select id="sg-n" aria-label="Number of stops">${[6,8,10,12,15].map(n => `<option value="${n}" ${n === (+store.get('vr_sg_n', 10)) ? 'selected' : ''}>${n} stops</option>`).join('')}</select>
    <select id="sg-day" aria-label="Day of the run" onchange="CAL.day=+this.value;store.set('vr_cal',CAL);renderList();renderPlan()"><option value="0" ${!CAL.day ? 'selected' : ''}>for today</option><option value="1" ${CAL.day === 1 ? 'selected' : ''}>for tomorrow</option></select>
    <button class="go" onclick="suggestRun()">Suggest a run</button>${PLAN.length ? '<button class="ghost2" onclick="clearPlan()">Clear picks</button>' : ''}</div>`;
  document.getElementById('pri').innerHTML = ['Stockist','A','B','C'].map(k => {
    const c = v.filter(l => pri(l) === k).length;
    return `<button class="chip ${showPri.has(k) ? '' : 'off'}" onclick="togglePri('${k}')"><span class="dot" style="background:${PRI[k]}"></span>${k === 'Stockist' ? 'Stockists' : 'Priority ' + k} <span style="color:var(--muted)">${c}</span></button>`;
  }).join('');
  const types = [...new Set(v.filter(l => showPri.has(pri(l))).map(l => l.cat))].sort();
  document.getElementById('types').innerHTML = types.map(t =>
    `<button class="chip ${hideTypes.has(t) ? 'off' : ''}" onclick="toggleType('${esc(t)}')">${esc(t)}</button>`).join('');
}
function togglePri(k) { showPri.has(k) ? showPri.delete(k) : showPri.add(k); store.set('vr_pri', [...showPri]); renderAll(true); }
function toggleType(t) { hideTypes.has(t) ? hideTypes.delete(t) : hideTypes.add(t); store.set('vr_hide_types', [...hideTypes]); renderAll(true); }

// ---------- Driving order ----------
// Suburbs run as a loop: sorted by bearing around the middle of the day's area, starting from the suburb
// closest to the distillery and heading the way that keeps the next hop shorter. Venues inside a suburb
// follow nearest next venue.
function ordered(list) {
  const subs = {};
  list.forEach(l => (subs[l.sub || 'Other'] = subs[l.sub || 'Other'] || []).push(l));
  let cen = Object.entries(subs).map(([name, ls]) => ({ name, ls, c: [ls.reduce((s, l) => s + +l.lat, 0)/ls.length, ls.reduce((s, l) => s + +l.lng, 0)/ls.length] }));
  if (cen.length > 2) {
    const mid = [cen.reduce((s, g) => s + g.c[0], 0)/cen.length, cen.reduce((s, g) => s + g.c[1], 0)/cen.length];
    cen.forEach(g => g.ang = Math.atan2(g.c[0] - mid[0], (g.c[1] - mid[1]) * Math.cos(mid[0]*Math.PI/180)));
    cen.sort((x, y) => x.ang - y.ang);
    const start = cen.reduce((bi, g, i) => km(BASE_PT, g.c) < km(BASE_PT, cen[bi].c) ? i : bi, 0);
    cen = [...cen.slice(start), ...cen.slice(0, start)];
    if (km(cen[0].c, cen[cen.length - 1].c) < km(cen[0].c, cen[1].c)) cen = [cen[0], ...cen.slice(1).reverse()];
  } else cen.sort((x, y) => km(BASE_PT, x.c) - km(BASE_PT, y.c));
  let at = BASE_PT;
  return cen.map(g => {
    const left = [...g.ls], seq = []; let p = at;
    while (left.length) { left.sort((x, y) => km(p, [x.lat, x.lng]) - km(p, [y.lat, y.lng])); const n = left.shift(); seq.push(n); p = [n.lat, n.lng]; }
    at = p; return { name: g.name, c: g.c, ls: seq };
  });
}

}
function dist(gi) {

}
function rowHtml(l) {

      <div class="acts">

const cssId = id => id.replace(/[^a-z0-9]/gi, '_');

function toggleGroup(name, gi) { shut.has(name) ? shut.delete(name) : shut.add(name); document.getElementById('g' + gi).classList.toggle('shut'); }

// ---------- Plan (today's route) ----------
function togglePlan(id) {

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 3500); }

// Add or remove a whole suburb in one tap (only the venues showing under the current filters)
function addGroup(gi) {

  if (g.ls.every(l => PLAN.includes(l.id))) { PLAN = PLAN.filter(id => !g.ls.some(l => l.id === id)); toast('Removed ' + g.name); }
  else {
    const room = MAX_STOPS - PLAN.length, add = g.ls.filter(l => !PLAN.includes(l.id));
    if (room <= 0) { toast(MAX_STOPS + ' stops is a full day. Clear some first.'); return; }
    PLAN.push(...add.slice(0, room).map(l => l.id));
    toast(add.length > room ? `Added ${room} of ${add.length} from ${g.name}: that's a full day` : `Added ${add.length} from ${g.name}`);
  }
  store.set('vr_plan', PLAN); renderPlan(); renderList(); renderFilters(ALL.filter(l => l.zone === day)); drawMap(false);
}

// Suggest a run: what's due first (follow-ups, reorders, venues ready to order), then the best new venues,
// kept close together so the day is a tight loop instead of a zigzag.
let SUGG = {};
function suggestRun() {
  const n = +document.getElementById('sg-n').value || 10; store.set('vr_sg_n', n);
  const fu = new Set(dueFollowUps().map(e => e.vid)), ro = new Set(reordersDue().map(x => vidOf(x.l)));
  const lastSeen = l => { const d = LOG.filter(e => e.vid === vidOf(l)).map(e => e.date).sort(); return d[d.length - 1] || ''; };
  const recent = plusDays(-14), wd = runWd();
  const [sh, sm] = CAL.start.split(':').map(Number), runEnd = sh * 60 + sm + n * (+CAL.mins + 12);
  let closedN = 0;
  const cands = current().map(l => {
    if (closedOn(l, wd)) { closedN++; return null; }   // shut all day on the day of the run
    const v = vidOf(l), seen = lastSeen(l), pt = pitchFor(l);
    let score = 0, why = '';
    if (fu.has(v)) { score = 100; why = 'follow-up due'; }
    else if (ro.has(v)) { score = 85; why = 'reorder due'; }
    else if (pt.stage.startsWith('Tasted')) { score = 75; why = 'tasted, ready to order'; }
    else if (seen && seen >= recent) return null;   // seen in the last fortnight and nothing due
    else if (pt.stage === 'Missed last time') { score = 55; why = 'missed last time'; }
    else if (pri(l) === 'Stockist') { score = 45; why = 'stockist check-in'; }
    else if (pri(l) === 'A') { score = seen ? 40 : 50; why = seen ? 'priority A, follow up' : 'new priority A'; }
    else if (pri(l) === 'B') { score = seen ? 22 : 30; why = seen ? 'priority B, follow up' : 'new priority B'; }
    else { score = 8; why = 'priority C'; }
    score += ({ 'Bottle shop': 12, 'Bar': 10, 'Pub / Hotel': 7, 'Club': 5, 'Restaurant / Cafe': 3, 'Accommodation': 3, 'Gift / Retail': 3 })[l.cat] || 0;
    if (/estate|vineyard|winery|wines\b|cellar door|ferries/i.test(l.n) && !/cellars|liquor|bottle/i.test(l.n)) score -= 12;   // wineries and transport: slow movers for spirits
    score += Math.min(+l.cap || 0, 500) / 100;
    if (clashes(l, +CAL.day || 0, null).length) score -= 35;   // best-time note says not that day
    const op = firstOpen(l, wd); if (op != null && op >= runEnd) score -= 25;   // opens after the run would finish
    return { l, score, why };
  }).filter(Boolean);
  if (!cands.length) { toast('Nothing to suggest with these filters. Switch on more priorities or types.' + (closedN ? ` (${closedN} closed ${HOURS.SHORT[wd]})` : '')); return; }
  // anything due goes in first (follow-ups, reorders, tasted and ready to order), then the rest fill in around them
  const pool = cands.slice().sort((a, b) => b.score - a.score);
  const picked = pool.filter(c => c.score >= 75).slice(0, n);
  picked.forEach(c => pool.splice(pool.indexOf(c), 1));
  while (picked.length < n && pool.length) {
    let best = null, bestVal = -1e9;
    // stay close to what's already picked and to the middle of the day, so it grows one way instead of two
    const mid = picked.length ? [picked.reduce((t, x) => t + +x.l.lat, 0) / picked.length, picked.reduce((t, x) => t + +x.l.lng, 0) / picked.length] : null;
    pool.forEach(c => {
      const p2 = [c.l.lat, c.l.lng];
      const near = picked.length ? Math.min(...picked.map(x => km([x.l.lat, x.l.lng], p2))) : km(BASE_PT, p2) / 4;
      const val = c.score - 2 * near - (mid ? 2 * km(mid, p2) : 0);
      if (val > bestVal) { bestVal = val; best = c; }
    });
    picked.push(best); pool.splice(pool.indexOf(best), 1);
  }
  PLAN = picked.map(c => c.l.id); SUGG = {}; picked.forEach(c => SUGG[c.l.id] = c.why);
  store.set('vr_plan', PLAN); renderPlan(); renderList(); renderFilters(ALL.filter(l => l.zone === day)); drawMap(false);
  const count = {}; picked.forEach(c => count[c.why] = (count[c.why] || 0) + 1);
  toast(`Suggested ${picked.length}: ` + Object.entries(count).map(([k, v]) => v + ' ' + k).join(', ') + (closedN ? `. Left out ${closedN} closed ${HOURS.SHORT[wd]}` : ''));
}
function clearPlan() { PLAN = []; SUGG = {}; if (runLive()) { RUN = null; store.set('vr_run', null); } store.set('vr_plan', PLAN); renderPlan(); renderList(); drawMap(false); renderFilters(ALL.filter(l => l.zone === day)); }
function planStops() {
  const left = PLAN.map(id => ALL.find(l => l.id === id)).filter(Boolean), seq = [];
  let p = BASE_PT;
  while (left.length) { left.sort((x, y) => km(p, [x.lat, x.lng]) - km(p, [y.lat, y.lng])); const n = left.shift(); seq.push(n); p = [n.lat, n.lng]; }
  return seq;
}
function renderPlan() {
  const seq = planStops(), bar = document.getElementById('plan');
  bar.classList.toggle('show', seq.length > 0 || runLive());
  const sb = document.getElementById('plan-start');
  if (sb) sb.textContent = runLive() ? `Resume run (stop ${RUN.idx + 1} of ${RUN.ids.length})` : 'Start run';
  if (!seq.length) return;
  let tot = 0, p = BASE_PT; seq.forEach(l => { tot += km(p, [l.lat, l.lng]); p = [l.lat, l.lng]; }); tot += km(p, BASE_PT);
  document.getElementById('plan-n').textContent = seq.length + ' stop' + (seq.length === 1 ? '' : 's') + ' planned';
  const wd = runWd(), known = seq.filter(l => hoursOf(l)).length, shutN = seq.filter(l => closedOn(l, wd)).length;
  document.getElementById('plan-sub').textContent = 'About ' + Math.round(tot * 1.3) + ' km by road, back to the distillery · ' +
    (shutN ? shutN + ' closed ' + HOURS.SHORT[wd] + ' · ' : '') + 'hours known for ' + known + ' of ' + seq.length;
  const pts = seq.map(l => l.lat + ',' + l.lng), dest = pts.pop();
  document.getElementById('plan-go').style.display = seq.length <= GMAPS_MAX ? '' : 'none';
  document.getElementById('plan-go').href = 'https://www.google.com/maps/dir/?api=1&destination=' + dest +
    (pts.length ? '&waypoints=' + encodeURIComponent(pts.join('|')) : '') + '&travelmode=driving';
}

// ---------- Map ----------
const map = L.map('map', { zoomControl:true, maxZoom:18 });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution:'&copy; Esri &copy; OpenStreetMap contributors', maxNativeZoom:15, maxZoom:18 }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom:15, maxZoom:18 }).addTo(map);
let layer = L.layerGroup().addTo(map), markers = {};
L.marker(BASE_PT, { icon: L.divIcon({ className:'', html:'<div class="sub-lbl" style="border-color:#e94560">Via Nova</div>', iconSize:null }) }).addTo(map);

function drawMap(fit) {
  layer.clearLayers(); markers = {};
  const all = [];
  groups.forEach((g, gi) => {
    L.marker(g.c, { icon: L.divIcon({ className:'', html:`<div class="sub-lbl s">${gi + 1} ${esc(g.name)}</div>`, iconSize:null, iconAnchor:[-14, 10] }), interactive:false, zIndexOffset:-1000 }).addTo(layer);
    g.ls.forEach(l => {
      const p = pri(l), picked = PLAN.includes(l.id);
      const m = L.marker([l.lat, l.lng], { icon: L.divIcon({ className:'', iconSize:[22,22], iconAnchor:[11,11],
        html:`<div class="mk ${l.st === 'contacted' ? 'contacted' : ''} ${picked ? 'picked' : ''}" style="background:${PRI[p]}">${p === 'Stockist' ? '&#9733;' : p}</div>` }) })
        .bindPopup(`<b>${esc(l.n)}</b><br>${esc(l.cat)} · ${p === 'Stockist' ? 'Stockist' : 'Priority ' + p}<br>${esc(l.a || '')}
          <br><button style="margin-top:6px;padding:5px 10px;border-radius:5px;border:none;background:${picked ? '#555' : '#e94560'};color:#fff;font-weight:700;cursor:pointer"
          onclick="map.closePopup();planFromMap('${jsId(l.id)}')">${picked ? 'Remove from today' : 'Add to today\'s run'}</button>`)
        .on('click', () => hl(l.id, true)).addTo(layer);
      markers[l.id] = m; all.push([l.lat, l.lng]);
    });
  });
  const seq = planStops();
  if (seq.length) L.polyline([BASE_PT, ...seq.map(l => [l.lat, l.lng]), BASE_PT], { color:'#e94560', weight:3, opacity:.85, dashArray:'6 6' }).addTo(layer);
  if (fit && all.length) map.fitBounds(L.latLngBounds([...all, BASE_PT]).pad(0.08));
  document.getElementById('map').classList.toggle('far', map.getZoom() < 11);
}
map.on('zoomend', () => document.getElementById('map').classList.toggle('far', map.getZoom() < 11));
function fly(id) { const m = markers[id]; if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup(); } }
let lastHl = null;
function hl(id, scroll) {
  if (lastHl) { const o = document.getElementById('v-' + cssId(lastHl)); if (o) o.classList.remove('hl'); }
  const el = document.getElementById('v-' + cssId(id)); lastHl = id;
  if (el) { el.classList.add('hl'); if (scroll) { el.closest('.grp').classList.remove('shut'); el.scrollIntoView({ behavior:'smooth', block:'center' }); } }
}

// ---------- Run mode: one stop at a time, handed to Waze ----------
// Waze links take one destination, so the run works stop by stop: park, log the visit, tap next, Waze opens to the next stop.
const PITCH = {
  'Bottle shop':        ['Gin 700ml and the RTD carton', 'What do people ask for that you can\'t give them?'],
  'Bar':                ['Gin and vodka 1L for the back bar', 'What\'s your best selling gin serve?'],
  'Pub / Hotel':        ['Gin 1L and the RTD carton', 'What\'s moving out of the fridge besides beer?'],
  'Club':               ['RTD carton', 'What do members drink after the game?'],
  'Restaurant / Cafe':  ['Gin 700ml for the drinks list', 'Do guests ask what\'s local?'],
  'Accommodation':      ['Gin 200ml for rooms and welcome packs', 'What do you put in the room for guests?'],
  'Gift / Retail':      ['Gin 200ml at the counter', 'What do people add to a gift at the counter?'],
  'Corporate / Gifting':['Gin 200ml or 700ml as client gifts', 'What do you give clients at Christmas?'],
  'Function / Events':  ['Gin and vodka 1L for the bar, RTD for big events', 'What spirits do you pour at functions?'],
};
const OUTCOMES = ['Visit', 'Manager tasting', 'Order', 'Customer tasting', 'Not in'];
let RUN = store.get('vr_run', null);   // { date, ids, idx }
let LOG = store.get('vr_log', []);     // one row per logged stop, shaped like the Activity Log
let pick = null;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dmy = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4) : '';
const waze = l => l.lat != null ? `https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes` : `https://waze.com/ul?q=${encodeURIComponent(l.a)}&navigate=yes`;
const stopById = id => id && id.startsWith('d:') ? (RUN.det || {})[id] : ALL.find(x => x.id === id);
const byVid = v => ALL.find(l => (l.vid || l.id) === v);
const vidOf = l => l.vid || l.id;

// The pitch moves with the venue: what stage it's at (from the visit log and its status), the next step you
// left yourself last time, and anything your notes flagged (price, shelf space, the owner, tastings, local).
const CUES = [
  [/price|expensive|cost|cheap|margin/i, 'Price came up before: on the 1L it\'s about $1.90 a pour, and RRP leaves a 25% markup.'],
  [/shelf|room|space|full/i, 'Space came up: offer one facing, or the 200ml at the counter.'],
  [/owner|boss|buyer|manager (is )?(away|off|on leave)|decision/i, 'Last time it needed someone else: ask for the decision maker by name.'],
  [/local|geelong|made here/i, 'They responded to "local": lead with made in Newtown.'],
  [/rtd|can|carton/i, 'RTD came up: bring a cold can.'],
  [/1l|1 l|litre/i, 'The 1L came up: bring a 1L sample.'],
  [/cocktail|serve|g&t|gin and tonic/i, 'Serves came up: offer to build a house serve with them.'],
];
function pitchFor(l) {
  const [lead, ask] = PITCH[l.cat] || ['Gin 700ml', 'What do customers ask for that\'s local?'];
  const hist = LOG.filter(e => e.vid === vidOf(l));
  const last = hist[hist.length - 1];
  const has = a => hist.some(e => e.act === a);
  let stage, line, q;
  if (l.st === 'stockist' || has('Order')) {
    if (!has('Customer tasting')) { stage = 'Stockist: grow it'; line = 'Check the shelf or back bar and how it\'s moving, then offer a customer tasting on a busy day.'; q = 'How has it gone since the first order?'; }
    else { stage = 'Stockist: reorder and add a line'; line = 'Ask for the reorder, then add a size or product they don\'t carry yet (1L, 200ml or the RTD).'; q = 'What\'s sold best, and what would you add?'; }
  } else if (has('Manager tasting') || has('Customer tasting')) {
    stage = 'Tasted: ask for the order'; line = 'They\'ve tasted it. Suggest a small first order: two gin and one vodka, delivered this week.'; q = 'Shall we start you with two gin and one vodka?';
  } else if (last && /^Not in/.test(last.outcome || '')) {
    stage = 'Missed last time'; line = 'Find out who buys and when they\'re in, and leave a 200ml sample if it fits.'; q = 'Who looks after the spirits, and when are they in?';
  } else if (hist.length) {
    stage = 'Met, not tasted'; line = `Get it tasted. Lead with ${lead}.`; q = ask;
  } else { stage = 'First visit'; line = `Lead with ${lead}.`; q = ask; }
  const text = hist.map(e => (e.outcome || '') + ' ' + (e.next || '')).join(' ') + ' ' + (l.note || '');
  const tips = CUES.filter(([re]) => re.test(text)).map(([, t]) => t).slice(0, 2);
  return { stage, line, q, next: last && last.next ? last.next : '', tips };
}

function clashes(l, dateOff, startMin) {

  const m = b.match(/avoid\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);

function milesCardHtml() {
  const m = MILES[today()] || {}, est = (RUN && RUN.estKm) || Math.round(planKm() * 1.3);
  return `<div class="card"><h4 style="margin-top:0">Mileage</h4>
    <div class="row2"><input class="fld" id="m-start" type="number" inputmode="numeric" placeholder="Odometer start" value="${m.start || ''}">
    <input class="fld" id="m-end" type="number" inputmode="numeric" placeholder="Odometer end" value="${m.end || ''}"></div>
    <div class="addr" style="font-size:12px">Planner estimate: about ${est} km.</div>
    <button class="bigbtn ghost" style="margin:8px 0 0" onclick="saveMiles(${est})">Save mileage</button><div id="m-ok" style="color:var(--a);font-size:13px"></div></div>`;
}
function saveMiles(est) {
  const s = +document.getElementById('m-start').value || '', e = +document.getElementById('m-end').value || '';
  const subs = [...new Set(LOG.filter(x => x.date === today()).map(x => x.sub).filter(Boolean))].join(', ');
  MILES[today()] = { ...(MILES[today()] || {}), start: s, end: e, est, note: 'Via Nova sales run' + (subs ? ': ' + subs : '') };
  store.set('vr_miles', MILES); document.getElementById('m-ok').textContent = 'Saved' + (s && e ? ': ' + (e - s) + ' km' : '');
}
function milesCsv() {
  const rows = [['Date','Odometer start','Odometer end','Km travelled','Planner estimate (km)','Purpose']];
  Object.keys(MILES).sort().forEach(d => { const m = MILES[d]; rows.push([dmy(d), m.start || '', m.end || '', m.start && m.end ? m.end - m.start : '', m.est || '', m.note || 'Via Nova sales run']); });
  dlText('﻿' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n'), 'via-nova-mileage.csv', 'text/csv');
}

// ---------- Weekly report ----------
function weekStart(off) { const d = new Date(); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd - 7 * off); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); const x = new Date(y, m - 1, d + n); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); }
function weeklyText(off) {
  const a = weekStart(off), z = addDays(a, 6), w = LOG.filter(e => e.date >= a && e.date <= z);
  const n = act => w.filter(e => e.act === act).length, orders = w.filter(e => e.act === 'Order');
  const firstOrder = vid => LOG.filter(e => e.vid === vid && e.act === 'Order').map(e => e.date).sort()[0];
  const newSt = [...new Set(orders.filter(e => firstOrder(e.vid) >= a).map(e => e.n))];
  const venues = new Set(w.map(e => e.vid)).size;
  const kmW = Object.keys(MILES).filter(d => d >= a && d <= z).reduce((s, d) => s + (MILES[d].start && MILES[d].end ? MILES[d].end - MILES[d].start : (MILES[d].est || 0)), 0);
  const fu = w.filter(e => e.fu).map(e => `${e.n} (${dmy(e.fu)}${e.next ? ', ' + e.next : ''})`);
  return `Via Nova sales week ${dmy(a)} to ${dmy(z)}\n\n` +
    `Venues visited: ${venues}\nCalls with no tasting: ${n('Visit')}\nManager tastings: ${n('Manager tasting')}\nCustomer tastings: ${n('Customer tasting')}\n` +
    `Orders: ${orders.length} (${orders.reduce((s, e) => s + (+e.bottles || 0), 0)} units, ${money(orders.reduce((s, e) => s + (+e.val || 0), 0))} inc GST)\n` +
    `New stockists: ${newSt.length}${newSt.length ? ' (' + newSt.join(', ') + ')' : ''}\n` + (kmW ? `Km driven: ${kmW}\n` : '') +
    (orders.length ? `\nOrders\n${orders.map(e => `${e.n}: ${e.products || e.bottles + ' units'}`).join('\n')}\n` : '') +
    (fu.length ? `\nFollow-ups booked\n${fu.join('\n')}\n` : '');
}
function renderReport(off) {
  const txt = weeklyText(off);
  document.getElementById('run-title').textContent = 'Weekly report';
  document.getElementById('run-body').innerHTML = `
    <div class="opts" style="margin-bottom:10px"><button class="opt ${off === 0 ? 'on' : ''}" onclick="renderReport(0)">This week</button><button class="opt ${off === 1 ? 'on' : ''}" onclick="renderReport(1)">Last week</button></div>
    <div class="card"><div class="hist" style="white-space:pre-line">${esc(txt)}</div></div>
    <button class="bigbtn next" onclick="navigator.clipboard.writeText(document.getElementById('rep-txt').value).then(()=>this.textContent='Copied')">Copy the report</button>
    <a class="bigbtn ghost" href="sms:${telOf(SET.orderPhone)}?&body=${encodeURIComponent(txt)}">Text it</a>
    <a class="bigbtn ghost" href="mailto:${encodeURIComponent(SET.orderEmail || '')}?subject=${encodeURIComponent('Via Nova sales week ' + dmy(weekStart(off)))}&body=${encodeURIComponent(txt)}">Email it</a>
    ${canShare ? `<button class="bigbtn ghost" onclick="shareText('Via Nova weekly report', document.getElementById('rep-txt').value)">Share it (other apps)</button>` : ''}
    <textarea id="rep-txt" style="position:absolute;left:-9999px">${esc(txt)}</textarea>
    <button class="bigbtn ghost" onclick="openMore()">Back</button>`;
}

// ---------- Backup and restore ----------
const BK_KEYS = ['vr_log','vr_contacts','vr_best','vr_miles','vr_settings','vr_plan','vr_run','vr_cal','vr_pri','vr_hide_types','vr_day','vr_kit','vr_hours','vm_edits','vm_added'];
function backup() {
  const data = { app: 'via-nova-route-planner', saved: new Date().toISOString(), keys: {} };
  BK_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) data.keys[k] = v; });
  const name = 'via-nova-backup-' + today() + '.json', txt = JSON.stringify(data);
  store.set('vr_lastbackup', today()); renderList();
  shareFile(name, txt, 'application/json').then(done => { if (!done) dlText(txt, name, 'application/json'); });
}
function restore(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (d.app !== 'via-nova-route-planner') throw new Error();
      if (!confirm('Replace everything on this device with the backup from ' + d.saved.slice(0, 10) + '?')) return;
      Object.entries(d.keys).forEach(([k, v]) => localStorage.setItem(k, v)); location.reload();
    } catch (e) { alert('That file is not a route planner backup.'); }
  };
  r.readAsText(file);
}
function backupNag() {
  if (!LOG.length) return '';
  const last = store.get('vr_lastbackup', ''), days = last ? Math.round((new Date(today()) - new Date(last)) / 864e5) : null;
  if (last && days < 7) return '';
  return `<div style="margin-bottom:6px"><b style="color:var(--accent)">${last ? 'Last backup ' + days + ' days ago' : 'Not backed up yet'}.</b> <a href="#" onclick="backup();return false" style="color:var(--gold)">Back up now</a></div>`;
}

// ---------- More menu ----------
function openMore() {
  showOverlay();
  document.getElementById('run-title').textContent = 'More';
  const last = store.get('vr_lastbackup', '');
  document.getElementById('run-body').innerHTML = `
    <div class="card"><h4 style="margin-top:0">Reports</h4>
      <button class="bigbtn ghost" onclick="renderReport(0)">Weekly report for the owner</button>
      <button class="bigbtn ghost" onclick="milesCsv()">Download the mileage log (CSV)</button>
      <button class="bigbtn ghost" style="margin-bottom:0" onclick="contactsCsv()">Download all contacts (CSV)</button></div>
    <div class="card"><h4 style="margin-top:0">Backup</h4>
      <div class="addr" style="font-size:13px;margin-bottom:8px">Your visit log, contacts, best times and mileage live in this phone's browser. Back up weekly: on the Pixel, Back up now opens the share sheet, so pick Drive and it saves straight there. ${last ? 'Last backup ' + dmy(last) + '.' : 'No backup yet.'}</div>
      <button class="bigbtn next" onclick="backup()">Back up now</button>
      <label class="bigbtn ghost" style="margin-bottom:0">Restore from a backup<input type="file" accept=".json,application/json" style="display:none" onchange="this.files[0]&&restore(this.files[0])"></label></div>
    ${hoursCardHtml()}
    <div class="card"><h4 style="margin-top:0">Settings</h4>
      <label style="font-size:12px;color:var(--muted)">Your name (goes in the By column)<input class="fld" value="${esc(SET.name)}" onchange="saveSet('name',this.value.trim())"></label>
      <label style="font-size:12px;color:var(--muted)">Send orders and reports to (mobile)<input class="fld" type="tel" value="${esc(SET.orderPhone)}" onchange="saveSet('orderPhone',this.value.trim())"></label>
      <label style="font-size:12px;color:var(--muted)">Send orders and reports to (email)<input class="fld" type="email" value="${esc(SET.orderEmail)}" onchange="saveSet('orderEmail',this.value.trim())"></label>
      <label style="font-size:12px;color:var(--muted)">Flag a reorder after (days)<input class="fld" type="number" value="${+SET.reorderDays || 28}" onchange="saveSet('reorderDays',+this.value||28)"></label></div>
    <button class="bigbtn ghost" onclick="closeRun()">Close</button>`;
}

// ---------- Go ----------
function renderAll(fit) {
  const v = ALL.filter(l => l.zone === day);
  renderWeek(); renderFilters(v); renderList(); drawMap(fit); renderPlan(); saveBar();
}
document.getElementById('q').addEventListener('input', () => { renderList(); drawMap(false); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  try {
    const r = await fetch('locations.json', { cache:'no-cache' });
    build(await r.json());
  } catch (e) {
    document.getElementById('loader').textContent = 'No signal and no saved copy of the venue list yet. Open the planner once with signal and it will work offline after that.'; return;
  }
  if (!DAYS.some(d => d.key === day)) day = DAYS[0].key;
  renderAll(true);
  document.getElementById('loader').remove();
  if (RUN && RUN.date === today() && RUN.idx < RUN.ids.length) openRun();
})();
</script>
</body>
